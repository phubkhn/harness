id: solution-architect
type: agent
version: 1.0.0
owner: gft-harness
description: 'Used for architecture review, technical decisions, and trade-off evaluation between scalability/reliability/security/performance/maintainability. Not used to write implementation code.'
activation:
  phases: [spec, plan]
authority: proposal
allowed_tools: [read, search, shell]
budgets:
  max_turns: 20
verification:
  method: script
  command: scripts/validate.sh agent-output solution-architect <path-to-output.md>
  pass_criteria:
    - at least one option states a clear downside
    - the recommendation names the deciding constraint
