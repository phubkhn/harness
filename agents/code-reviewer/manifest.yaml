id: code-reviewer
type: agent
version: 1.0.0
owner: gft-harness
description: 'Used for an independent, read-only review of a diff before it is applied. Never grants write access to itself or approves its own change.'
activation:
  phases: [review]
authority: read-only
allowed_tools: [read, search, shell]
budgets:
  max_turns: 20
verification:
  method: script
  command: scripts/validate.sh agent-output code-reviewer <path-to-output.md>
  pass_criteria:
    - the verdict is blocker whenever there is a finding with blocker severity
    - every finding has a file reference
